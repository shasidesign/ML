<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — AI Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050A14;--surface:#0D1525;--surface2:#131D30;--border:rgba(99,179,237,0.12);--accent:#63B3ED;--accent2:#9F7AEA;--text:#E2E8F0;--muted:#718096;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;text-decoration:none;color:var(--text);}
  .logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .nav{display:flex;gap:4px;}
  .nav a{color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:8px;font-size:0.875rem;font-weight:500;transition:all 0.2s;}
  .nav a:hover{color:var(--text);background:var(--surface2);}
  .container{max-width:1200px;margin:0 auto;padding:3rem 2rem;}
  .page-title{font-size:1.75rem;font-weight:700;background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2rem;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}
  .outfit-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform 0.2s,border-color 0.2s;}
  .outfit-card:hover{transform:translateY(-4px);border-color:rgba(99,179,237,0.3);}
  .outfit-card img{width:100%;height:260px;object-fit:cover;}
  .outfit-label{padding:12px 16px;font-size:0.85rem;font-weight:500;color:var(--muted);}
  @media(max-width:600px){.nav{display:none;}}
</style>
</head>
<body>
<div class="topbar">
  <a href="/" class="logo"><div class="logo-icon">👗</div>AI Fashion</a>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/outfits/casual">Casual</a>
    <a href="/outfits/formal">Formal</a>
    <a href="/outfits/sports">Sports</a>
    <a href="/predict">Predict</a>
  </nav>
</div>
<div class="container">
  <h1 class="page-title">{{ title }}</h1>
  <div class="grid">
    {% for image in outfits %}
    <div class="outfit-card">
      <img src="{{ url_for('static', filename=image) }}" alt="{{ title }}" onerror="this.parentElement.style.display='none'">
      <div class="outfit-label">{{ title }}</div>
    </div>
    {% endfor %}
  </div>
</div>
</body>
</html>
