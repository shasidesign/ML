<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trial Expired — AI Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050A14;--surface:#0D1525;--border:rgba(99,179,237,0.12);--accent:#63B3ED;--accent2:#9F7AEA;--text:#E2E8F0;--muted:#718096;--warning:#F6AD55;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3rem;text-align:center;max-width:480px;width:90%;position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--warning),transparent);}
  .icon{font-size:4rem;margin-bottom:1.5rem;display:block;}
  h1{font-size:1.5rem;font-weight:700;margin-bottom:12px;color:var(--warning);}
  p{font-size:0.9rem;color:var(--muted);line-height:1.7;margin-bottom:2rem;}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;padding:12px 28px;font-family:inherit;font-size:0.9rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn:hover{opacity:0.85;}
</style>
</head>
<body>
<div class="card">
  <span class="icon">⏰</span>
  <h1>Trial Limit Reached</h1>
  <p>You have used all your free predictions. Please contact admin to upgrade your account for unlimited predictions.</p>
  <a href="/" class="btn">Go Back Home</a>
</div>
</body>
</html>
