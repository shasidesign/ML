<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAI Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0f172a;
        }

        .container{
            width:900px;
            height:500px;
            background:#1e293b;
            border-radius:20px;
            overflow:hidden;
            display:flex;
            box-shadow:0 0 30px rgba(0,0,0,0.4);
        }

        .left{
            width:50%;
            background:#111827;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .left img{
            width:70%;
        }

        .right{
            width:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#1e293b;
        }

        .form-box{
            width:80%;
            color:white;
        }

        .form-box h1{
            font-size:40px;
            margin-bottom:10px;
        }

        .form-box p{
            color:#cbd5e1;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:15px;
            margin-bottom:20px;
            border:none;
            border-radius:10px;
            background:#334155;
            color:white;
            font-size:16px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="left">
        <img src="{{ url_for('static', filename='images/lamp.png') }}">
    </div>

    <div class="right">

        <div class="form-box">

            <h1>Welcome Back</h1>

            <p>Login to continue</p>
 <form action="/login" method="POST">

    <input type="text" name="username" placeholder="Username" required>

    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login</button>

</form>

        </div>

    </div>

</div>

</body>

</html>
